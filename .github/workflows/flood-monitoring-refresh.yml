name: Greater Manchester Flood Monitoring Refresh

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: gm-flood-monitoring-production
  cancel-in-progress: false

jobs:
  refresh:
    name: Environment Agency to Azure SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}
      SQL_USER: ${{ vars.SQL_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          az account show \
            --query "{Subscription:name,State:state}" \
            --output table

      - name: Add temporary GitHub runner firewall rule
        id: firewall
        shell: bash
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)

          RULE_NAME="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "rule=${RULE_NAME}" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "${{ vars.SQL_RESOURCE_GROUP }}" \
            --server "${{ vars.SQL_SERVER_NAME }}" \
            --name "${RULE_NAME}" \
            --start-ip-address "${RUNNER_IP}" \
            --end-ip-address "${RUNNER_IP}" \
            --output none

          echo "Temporary firewall access configured."

      - name: Extract and validate Environment Agency data
        run: |
          python -m flood_monitoring.pipeline

      - name: Load Azure SQL warehouse
        run: |
          python -m flood_monitoring.database.azure_sql_loader

      - name: Run automated tests
        run: |
          python -m pytest -q

      - name: Display ETL run summary
        if: always()
        run: |
          if [ -f data/staging/latest/etl_run_summary.json ]; then
            cat data/staging/latest/etl_run_summary.json
          fi

      - name: Preserve ETL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flood-monitoring-etl-${{ github.run_id }}
          path: data/staging/latest/etl_run_summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary firewall rule
        if: always()
        shell: bash
        run: |
          RULE_NAME="${{ steps.firewall.outputs.rule }}"

          if [ -n "${RULE_NAME}" ]; then
            az sql server firewall-rule delete \
              --resource-group "${{ vars.SQL_RESOURCE_GROUP }}" \
              --server "${{ vars.SQL_SERVER_NAME }}" \
              --name "${RULE_NAME}" \
              --output none || true
          fi

          echo "Temporary firewall cleanup completed."

      - name: Pause Azure SQL after refresh
        if: always()
        shell: bash
        run: |
          SUB="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="${{ vars.SQL_RESOURCE_GROUP }}"
          SERVER="${{ vars.SQL_SERVER_NAME }}"
          DB="${{ vars.SQL_DATABASE }}"

          URL="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Sql/servers/${SERVER}/databases/${DB}"

          az rest \
            --method POST \
            --url "${URL}/pause?api-version=2025-01-01" \
            --output none || true

          echo "Azure SQL pause requested."
